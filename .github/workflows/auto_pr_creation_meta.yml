name: Update Meta on Component Repo Merge

on:
  workflow_call:
    secrets:
      RDKCM_RDKE:
        required: true

jobs:
  auto_pr_creation_meta:
    runs-on: ubuntu-latest
    #if: github.event.pull_request.merged == true
    steps:
      - name: Checkout build_tools_workflows code
        uses: actions/checkout@v4
        with:
          repository: ssitar583/build_tools_workflows
          path: 'tools'
          ref: develop

      - name: Checkout Meta Repository
        uses: actions/checkout@v4
        with:
          repository: 'ssitar583/meta-rdk-video'
          path: 'meta_repo'
          ref: develop
      
      - name: Update Git Config
        env:
          BOT_EMAIL: ${{ vars.RDKM_BOT_EMAIL }}
        run: |
            cd meta_repo
            git config user.name "bot"
            git config user.email "$BOT_EMAIL"
            cd ..

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install requests PyGithub GitPython

      - name: Run the update script
        env:
          GITHUB_TOKEN: ${{ secrets.RDKCM_RDKE }}
          GITHUB_ORG: 'ssitar583'
          META_REPO_PATH: ${{ github.workspace }}/meta_repo
          META_REPO_NAME: 'ssitar583/meta-rdk-video'
          PR_NUMBER: 111
          BASE_BRANCH: develop
        run: |
          cd meta_repo
          python3 ../tools/build_health_check_workflow_scripts/auto_pr_generation_meta.py
          cd ..
